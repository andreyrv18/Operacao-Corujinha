<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.min.css">
</head>

<body style="background: transparent; overflow: hidden;">
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="../index.html" target="_parent" class="navbar-brand">
                <img src="../assets/logo_corujinha36x40.webp" fetchpriority="high"  alt="Logo Operação Corujinha">
                <span class="text-brand">Operação Corujinha</span>
            </a>
            <div class="nav-links">
                <a href="../index.html#sobre" target="_parent">Sobre</a>
                <a href="../index.html#atividades" target="_parent">Atividades</a>
                <a href="../index.html#processo-seletivo" target="_parent">Junte-se a nós</a>
            </div>
        </div>
    </nav>

    <script>
        function sendHeight() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                window.parent.postMessage({ type: 'resize', id: id, height: document.body.scrollHeight }, '*');
            }
        }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
        new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });

        // Handle navigation clicks
        document.querySelectorAll('a[target="_parent"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href.includes('#')) {
                    const targetId = href.split('#')[1];
                    window.parent.postMessage({ type: 'scroll', target: targetId }, '*');
                } else if (href === '../index.html') {
                    window.parent.postMessage({ type: 'scroll', target: 'top' }, '*');
                }
            });
        });
    </script>
</body>

</html>
