<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg-main);
        }

        object {
            width: 100%;
            display: block;
            border: none;
            overflow: hidden;
            transition: height 0.3s ease;
        }
    </style>
</head>

<body>

    <object id="navbar" type="text/html" data="components/navbar.html?id=navbar"></object>

    <main>
        <object id="hero" data="secoes/hero.html?id=hero" type="text/html"></object>

        <object id="sobre" data="secoes/atendimento.html?id=sobre" type="text/html"></object>

        <object id="atividades" data="secoes/intervencoes.html?id=atividades" type="text/html"></object>

        <object id="processo-seletivo" data="secoes/juntese.html?id=processo-seletivo" type="text/html"></object>
    </main>

    <object id="footer" type="text/html" data="components/footer.html?id=footer"></object>

    <script>
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'resize') {
                const obj = document.getElementById(e.data.id);
                if (obj) {
                    obj.style.height = e.data.height + 'px';
                }
            }
            if (e.data && e.data.type === 'scroll') {
                if (e.data.target === 'top') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    const targetEl = document.getElementById(e.data.target);
                    if (targetEl) {
                        const rect = targetEl.getBoundingClientRect();
                        window.scrollTo({
                            top: window.scrollY + rect.top - 80, // 80px offset for navbar
                            behavior: 'smooth'
                        });
                    }
                }
            }
        });
    </script>
</body>

</html>
