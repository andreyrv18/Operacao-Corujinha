    <script>
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'resize') {
                const obj = document.getElementById(e.data.id);
                if (obj) {
                    obj.style.height = e.data.height + 'px';
                    sendHeight(); // Notify parent (index.html) of the new height
                }
            }
        });

        function sendHeight() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                window.parent.postMessage({ type: 'resize', id: id, height: document.body.scrollHeight }, '*');
            }
        }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
        new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
    </script>
