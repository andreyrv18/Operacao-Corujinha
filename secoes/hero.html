<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero - Operação Corujinha</title>
    <link rel="stylesheet" href="../style.min.css">
</head>

<body style="background: transparent; overflow: hidden;">
    <header class="hero">
        <div class="container hero-content">
            <div class="hero-image">
                <img src="../assets/logo_corujinha_semcontorno.webp" fetchpriority="high" alt="Mascote Operação Corujinha">
            </div>
            <div class="hero-text">
                <span class="hero-tag">Humanização Hospitalar</span>
                <h1>Operação Corujinha <br><span class="text-brand">Palhaços da Medicina</span></h1>
                <p class="hero-quote">
                    "Um sorriso pode não curar a doença, mas fortalece o coração para enfrentá-la."
                </p>
                <a href="../index.html#processo-seletivo" target="_parent" class="btn-primary">Quero ser voluntário</a>
            </div>
        </div>
    </header>

    <script>
        function sendHeight() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                window.parent.postMessage({ type: 'resize', id: id, height: document.body.scrollHeight }, '*');
            }
        }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
        new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });

        // Handle navigation clicks
        document.querySelectorAll('a[target="_parent"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                if (href.includes('#')) {
                    const targetId = href.split('#')[1];
                    window.parent.postMessage({ type: 'scroll', target: targetId }, '*');
                } else if (href === '../index.html') {
                    window.parent.postMessage({ type: 'scroll', target: 'top' }, '*');
                }
            });
        });
    </script>
</body>

</html>
